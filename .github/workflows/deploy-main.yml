name: Build and verify Skopia deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Main is deployed by the VPS cron job at /etc/cron.d/skopia-deploy-main.
# Keep cron as the deploy executor: it has DB/network access, backups and rollback.
# This workflow tests every main push and fails unless the public site reports
# that exact commit after the deployment completes.
concurrency:
  group: skopia-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out this commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and lint
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
      - name: Backend tests and production JAR
        run: ./mvnw -B clean package
      - name: Verify this main commit is live on the hosted site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 90); do
            actual="$(curl -fsS --connect-timeout 5 --max-time 10 https://skopia.randillasith.me/api/deployment 2>/dev/null | jq -r '.deployedSha // empty' 2>/dev/null || true)"
            if [ "$actual" = "$EXPECTED_SHA" ]; then
              curl -fsS --max-time 10 https://skopia.randillasith.me/api/health >/dev/null
              curl -fsS --max-time 10 https://skopia.randillasith.me/browse >/dev/null
              echo "Verified hosted Skopia deployment: $actual"
              exit 0
            fi
            echo "Waiting for hosted deployment of $EXPECTED_SHA (attempt $attempt/90; currently ${actual:-unavailable})"
            sleep 10
          done
          echo "::error::Hosted Skopia did not report the expected main commit $EXPECTED_SHA"
          exit 1
