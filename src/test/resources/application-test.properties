# FR5 tests run against in-memory H2 in MySQL mode, so the entity mappings are
# exercised as written rather than against a dialect that forgives more than
# MySQL does. Nothing here touches a developer's real database.
# Different Spring configurations must not drop each other's cached test schema.
spring.datasource.url=jdbc:h2:mem:skopia-test-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# The expiry sweep is triggered explicitly in the tests that care about it;
# letting cron fire underneath them would make their assertions time-dependent.
spring.task.scheduling.enabled=false
skopia.ads.expiry.cron=-
skopia.billing.renewal-reminder-cron=-

skopia.ads.media.storage-dir=${java.io.tmpdir}/skopia-test-uploads
skopia.auth.secret=test-only-secret-at-least-thirty-two-characters-long
# Mirrors the default in SecurityConfig, which must match the dev server port.
skopia.cors.allowed-origins=http://localhost:5175,http://localhost:5173

# Lets the performance tests count the queries a call actually makes, instead of
# asserting that a list endpoint is efficient and hoping.
spring.jpa.properties.hibernate.generate_statistics=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
