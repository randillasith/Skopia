# Run Skopia without setting up MySQL first:
#
#     ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# An in-memory database in MySQL compatibility mode, so the same entity mappings
# and the same JPQL run here as against the real thing. Everything is gone when
# the process stops, which is the point — this is for trying a feature out and
# for demonstrating one, never for keeping anything.
spring.datasource.url=jdbc:h2:mem:skopia;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# The expiry sweep runs often here so its effect is visible in a short sitting.
skopia.ads.expiry.cron=0 * * * * *
skopia.auth.secret=local-h2-only-secret-at-least-thirty-two-characters
